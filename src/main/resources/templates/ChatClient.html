<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Idealo Chat Assistant</title>
    <link rel="icon" th:href="@{/image/idealo.png}" type="image/png">
    <link rel="stylesheet"  th:href="@{/css/style.css}" />
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <style>
        .stop-btn {
     background-color: #d32f2f;   /* my stop uses a strong red */
     color: white;
     border: none;
     border-radius: 6px;          /* smooth rounded corners */
     padding: 10px 20px;
     font-size: 14px;
     font-weight: 600;
     cursor: pointer;
     box-shadow: 0 2px 6px rgba(0,0,0,0.2);
     transition: background-color 0.2s ease, transform 0.1s ease;
   }

   .stop-btn:hover {
     background-color: #b71c1c;   /* darker red on hover */
     transform: scale(1.05);      /* subtle zoom effect */
   }

   .stop-btn:active {
     background-color: #9a0007;   /* pressed state */
     transform: scale(0.95);
   }



    </style>
</head>
<body>
<h3 style="color: #0078D4"><center>


</center>
</h3>
<div class="chat-container">
    <div class="chat-header">
        <img th:src="@{/image/idealo.png}" alt="Idealo Logo" class="logo" /> &nbsp; Chat Assistant
        <div align="right"><a onclick="toggleReadMode()" href="javascript:void(0);">Toggle Read Aloud 🔊</a> </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message assistant">
            <div class="bubble">Hey there! Ready to scaffold your queries?</div>
        </div>
        <div class="message user">
            <div class="bubble">Let’s start.</div>
        </div>
        <!-- Add more messages here -->
    </div>

    <div class="chat-input">
        <input type="text" placeholder="Type your message..." />
        <button>Send</button>
        <button class="stop-btn" onclick="stopGenerating()">⏹ Stop</button>
    </div>
</div>
<script>
    var readAloudEnabled=false;
    const inputField = document.querySelector('.chat-input input');
    const sendButton = document.querySelector('.chat-input button');
    const chatMessages = document.getElementById('chatMessages');
    let source = null;
    let buffer = "";
    sendButton.addEventListener('click', () => {
      buffer="";
      const userText = inputField.value.trim();
      if (userText === '') return;

      // Create user message bubble
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', 'user');

      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('bubble');
      bubbleDiv.textContent = userText;

      messageDiv.appendChild(bubbleDiv);
      chatMessages.appendChild(messageDiv);

      // Auto-scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Clear input
      inputField.value = '';

      source = new EventSource('/search/stream?q='+encodeURIComponent(userText));
assistantMessageDiv =null;
assistantBubbleDiv =null;

source.onmessage = function(event) {
    console.log('New message:', event);
    if(null=== assistantMessageDiv){
               assistantMessageDiv = document.createElement('div');

              assistantMessageDiv.classList.add('message', 'assistant');

               assistantBubbleDiv = document.createElement('div');
              assistantBubbleDiv.classList.add('bubble');


              assistantMessageDiv.appendChild(assistantBubbleDiv);
              chatMessages.appendChild(assistantMessageDiv);
              chatMessages.scrollTop = chatMessages.scrollHeight;
}
let chunk=event.data;
if (!buffer.endsWith(" ") && !chunk.startsWith(" ")) {
    buffer += " ";
  }

  buffer += chunk;

    updatePreview(assistantBubbleDiv);
    /* if readAloudEnabled is true then TTS */
    if(readAloudEnabled===true){
           speakStreamedText(event.data);
    }
};

 source.onerror = () => {
    console.log("\n\n❌ Stream disconnected.");
    source.close();
    buffer = "";
  };
source.addEventListener('done', (event) => {
  console.log('Stream ended:', event.data);
  source.close();
  buffer="";
});

});
// Listen for keydown event
inputField.addEventListener("keydown", function(event) {
  if (event.ctrlKey && event.code === "Enter") {
    event.preventDefault(); // optional: prevent default browser behavior
   sendButton.click();
  }
});



function speakStreamedText(textChunk) {


  buffer += textChunk;

  // Check for sentence-ending punctuation
  const match = buffer.match(/(.+?[.!?])(\s|$)/);
  console.log("match ===>"+match);
  if (match) {
    const sentence = match[1];
    const utterance = new SpeechSynthesisUtterance(buffer);
  utterance.lang = 'en-US'; // or 'hi-IN' for Hindi
  utterance.rate = 1;       // speed (0.1 to 10)
  utterance.pitch = 1;      // voice pitch (0 to 2)
  speechSynthesis.speak(utterance);
    buffer = buffer.slice(match[0].length); // remove spoken part
  }


}

    function detectDirection(text) {
    const rtlChars = /[\u0591-\u07FF\uFB1D-\uFDFD\uFE70-\uFEFC]/;
    return rtlChars.test(text) ? 'rtl' : 'ltr';
}

function updatePreview(preview) {
    const markdownContent = buffer;
    const renderedHTML = marked.parse(markdownContent);

    const direction = detectDirection(markdownContent);
    preview.style.direction = direction;
    preview.innerHTML = renderedHTML;
}


    let stopGenerating =()=>{
        console.log("\n\n❌ Stream interrupted by the user.");
    source.close();
     buffer = "";
    };

    let toggleReadMode=()=>{
        readAloudEnabled = !readAloudEnabled;
        if(readAloudEnabled){
            console.log("Read Aloud is Enabled 🔊");
        }else{
            console.log("Read Aloud is Disabled 🔇");
        }
    };
</script>
</body>
</html>
