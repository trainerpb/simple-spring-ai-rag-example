spring.application.name=git 


logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG



# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=soham
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI OpenAI Configuration
spring.ai.openai.base-url=http://127.0.0.1:1234
spring.ai.openai.api-key=""
spring.ai.openai.embedding.options.model=text-embedding-nomic-embed-text-v1.5
spring.ai.openai.chat.options.model=ai/gemma3
spring.ai.openai.chat.base-url=http://localhost:12434/engines
spring.ai.openai.chat.api-key=ignored

# Spring AI Vector Configuration
spring.ai.vectorstore.pgvectror.index-type=HNSW
spring.ai.vectorstore.pgvectror.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvectror.dimensions=768
spring.ai.vectorstore.pgvectror.max-document-batch-size=10000
spring.ai.vectorstore.pgvectror.schema-validation=true
spring.ai.vectorstore.pgvectror.table-name=vector_store